name: WinBuild
on:
    workflow_dispatch: {}
    schedule:
        # 毎日、JST 午前3時に実行
        - cron: '0 18 * * *'

jobs:
    build:
        runs-on: [self-hosted, Windows, X64]
        steps:
            - name: Build
              run: ../../../build.cmd
            - name: DiscordFailurePost
              if: failure()
              shell: powershell
              run: |
                $repository = "${{ github.repository }}"
                $branch = "${{ github.ref_name }}"
                $runId = "${{ github.run_id }}"
                $webhookUrl = "${{ secrets.DISCORD_WEBHOOK_URL }}"

                $body = @"
                {
                  "embeds": [
                    {
                      "title": "Build Failed Notification",
                      "description": "WinBuild workflow has failed",
                      "color": 15158332,
                      "fields": [
                        {
                          "name": "Repository",
                          "value": "$repository",
                          "inline": true
                        },
                        {
                          "name": "Branch",
                          "value": "$branch",
                          "inline": true
                        },
                        {
                          "name": "View Logs",
                          "value": "[GitHub Actions](https://github.com/$repository/actions/runs/$runId)",
                          "inline": true
                        }
                      ]
                    }
                  ]
                }
                "@
                
                Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $body -ContentType "application/json"