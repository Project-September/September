name: WinBuild
on:
    workflow_dispatch: {}
    schedule:
        # 毎日、JST 午前3時に実行
        - cron: '0 18 * * *'

jobs:
    build:
        runs-on: [self-hosted, Windows, X64]
        steps:
            - name: Build
              run: ../../../build.cmd
            - name: DiscordFailurePost
              if: failure()
              run: |
                curl -H "Content-Type: application/json" \
                -X POST \
                -d '{
                  "embeds": [{
                    "title": "🚨 ビルド失敗通知",
                    "description": "WinBuild ワークフローが失敗しました",
                    "color": 15158332,
                    "fields": [
                      {
                        "name": "リポジトリ",
                        "value": "${{ github.repository }}",
                        "inline": true
                      },
                      {
                        "name": "ブランチ",
                        "value": "${{ github.ref_name }}",
                        "inline": true
                      },
                      {
                        "name": "ログを確認",
                        "value": "[GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})",
                        "inline": true
                      }
                    ],
                  }]
                }' \
                ${{ secrets.DISCORD_WEBHOOK_URL }}